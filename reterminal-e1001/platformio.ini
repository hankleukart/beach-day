; Beach Day — reTerminal E1001 (Seeed, ESP32-S3R8, 7.5" GDEY075T7 / UC8179)
;
;   pio run -e reterminal_e1001 -t upload    build + flash over USB-C
;   pio device monitor                        115200 baud, USB CDC
;   pio test -e native                        run the rules tests on your Mac
;
; Seeed's Arduino docs say "select XIAO_ESP32S3, PSRAM: OPI" — this env is the
; PlatformIO equivalent. The E1001 has 32 MB flash but the XIAO profile
; declares 8 MB; the firmware is ~1.2 MB so the extra flash is simply unused.

[platformio]
default_envs = reterminal_e1001

; ---- shared by every panel ---------------------------------------------------
[base]
; Pinned so a checkout of an old tag rebuilds the same firmware. Unpinned,
; `platform = espressif32` follows the latest release and the Seeed fork
; follows whatever is on its master branch - neither is under our control.
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
; The rules JSON lives on LittleFS (pio run -t uploadfs) so copy and thresholds
; change without a rebuild; tools/pio_prebuild.py also embeds a fallback copy.
board_build.filesystem = littlefs
extra_scripts = pre:tools/pio_prebuild.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; The E1001's USB-C goes to a hardware UART bridge (it enumerates as
    ; /dev/cu.usbserial-*, and esptool resets it via RTS), so Serial must map to
    ; UART0 on GPIO43/44. With CDC_ON_BOOT=1 it would go to the native USB
    ; peripheral instead, which nothing is connected to, and the log vanishes.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    ; setup() runs the whole cycle on loopTask, and an mbedTLS handshake needs
    ; several KB on top of our own locals - the 8 KB default overflowed into a
    ; double exception inside the TLS seeding. The core checks this name before
    ; the CONFIG_-prefixed one, which sdkconfig.h pins to 8192.
    -DARDUINO_LOOP_STACK_SIZE=16384
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    ; Seeed's fork of GxEPD2 — the panel class GxEPD2_750_GDEY075T7 plus the
    ; reTerminal examples. Identifies itself as GxEPD2 1.6.9.
    https://github.com/Seeed-Projects/Seeed_GxEPD2.git#1100ea3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.3
test_ignore = test_dayrules

; ---- reTerminal E1001: 7.5" mono, GDEY075T7 ---------------------------------
[env:reterminal_e1001]
extends = base

; ---- reTerminal E1002: 7.3" 6-colour ACeP, GDEP073E01 -----------------------
; Same 800x480 and the same pins, so the layout is identical; only the driver
; and the role-to-ink mapping differ (src/panel_e1002.cpp, src/paint.cpp).
[env:reterminal_e1002]
extends = base
build_flags = ${base.build_flags} -DPANEL_COLOR=1

; Same firmware, but it stays awake instead of deep-sleeping so the USB serial
; port survives and the buttons drive an on-device self-test. Use this on the
; bench: pio run -e dev -t upload && pio device monitor
[env:dev]
extends = base
build_flags = ${base.build_flags} -DBEACHDAY_DEV=1 -DCORE_DEBUG_LEVEL=3

[env:dev_e1002]
extends = base
build_flags = ${base.build_flags} -DPANEL_COLOR=1 -DBEACHDAY_DEV=1 -DCORE_DEBUG_LEVEL=3

; Host build of the v3 engine (lib/dayrules), exercised by test/test_dayrules
; against the same shared/v3/day-outcomes.json the device ships.
[env:native]
platform = native
build_flags = -std=gnu++17 -DBEACHRULES_NATIVE -DDAYRULES_SPEC_PATH=\"../shared/v3/day-outcomes.json\"
lib_deps = bblanchon/ArduinoJson@7.4.3
lib_compat_mode = off
lib_ignore = stb
test_framework = unity
