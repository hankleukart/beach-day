# Beach Day — what the display decides and says.
#
# This file IS the rules. The board reads it directly: no build step, no
# generated copy. Edit, push, and every display picks it up within a day
# (or immediately if someone holds the left button while it wakes).
#
# Before pushing:  cd reterminal-e1001 && ./flash.sh test
# That replays this exact file through the real engine and tells you what is
# wrong and where, instead of a board quietly keeping its old rules.

# Every icon the firmware can draw. Adding one means adding a vector to
# tools/gen_icons.py and rebuilding, so this list is the contract.
# (Top-level keys must come before any [table], so this lives up here.)
icons = [
  "sun", "sun_and_waves", "cloud", "rain_cloud", "raindrop",
  "wind", "leaf", "thermometer", "sun_hat", "sunscreen",
  "swim_trunks", "towel", "water_bottle", "tshirt", "shorts",
  "sneaker", "sweater", "hoodie", "jacket", "long_pants",
  "raincoat", "rain_boot", "umbrella", "puffy_coat", "beanie",
  "mittens", "scarf", "sunset", "sandals", "cap", "sunglasses", "gloves",
  "snow_boot", "snow_pants", "backpack", "snowflake",
  "beach", "pool", "splash_pad", "sledding_hill", "ice_rink", "paper_boat",
  "kite", "sailboat", "sprinkler", "water_balloon", "pinwheel", "frisbee",
  "picnic_blanket", "sidewalk_chalk", "sled", "ice_skate",
]

version = "3.0"
name = "Beach Day Outcomes"


# ─── Screen ──────────────────────────────────────────────────────────────

[screen]
location = "VENICE BEACH"   # the eyebrow; a setup-portal label wins over this
# The top-right corner shows the board's own state - last update and battery -
# so it is not configurable here.
subline  = "{conditionSummary} · {tempMinF}° this morning, {tempMaxF}° this afternoon"
footer   = "Sunset {sunsetLocal}"

# "dark" is white type on a black panel, "light" is black on white.
# Colour panels (E1002) can also set an ink per outcome - see `color` below.
hero_panel_default = "light"


# ─── Holidays ────────────────────────────────────────────────────────────
# The name is prefixed to whatever the day already is: "Christmas Rain Boots
# Day". Keep it to the bare form - "Memorial", not "Memorial Day" - because a
# day name always follows it.
#
# Fixed dates take month + day; floating ones take month + weekday + nth
# (weekday 0 = Sunday, nth -1 = last of the month).

[[holiday]]
name = "New Year's"
month = 1
day = 1

[[holiday]]
name = "Valentine's"
month = 2
day = 14

[[holiday]]
name = "Halloween"
month = 10
day = 31

[[holiday]]
name = "Christmas Eve"
month = 12
day = 24

[[holiday]]
name = "Christmas"
month = 12
day = 25

[[holiday]]
name = "New Year's Eve"
month = 12
day = 31

[[holiday]]
name = "Thanksgiving"
month = 11
weekday = 4
nth = 4   # 4th Thursday of November

[[holiday]]
name = "Mom's"
month = 5
weekday = 0
nth = 2   # 2nd Sunday of May

[[holiday]]
name = "Dad's"
month = 6
weekday = 0
nth = 3   # 3rd Sunday of June

[[holiday]]
name = "Memorial"
month = 5
weekday = 1
nth = -1   # last Monday of May

[[holiday]]
name = "Labor"
month = 9
weekday = 1
nth = 1   # 1st Monday of September


# ─── Clothing ────────────────────────────────────────────────────────────
# The catalogue outcomes pick from. Each item is written as it appears on its
# tile - "Rain boots" - and an outcome's `wear` lists items by that same name.
# `icon` must be one of the names in `icons` at the top. A label is one tile, 101px wide: about 12 characters
# fit at full size, and longer ones shrink to fit - keep everything above
# 12px, roughly 17 characters, or it gets hard to read across a room.
#
# `whimsy` is the sillier take on the same thing. Now and then one tile on
# the screen swaps to one of them (see [whimsy] below). The rule for adding
# one: it has to do the original's job. Bellbottoms are still light pants;
# a duck umbrella still keeps you dry. A parasol is not an umbrella. The
# tile keeps the original's icon, so the picture stays true either way.

[wear]
# Tops
"T-shirt"           = { icon = "tshirt",       whimsy = ["Tie-dye tee", "Rocket ship tee"] }
"Light T-shirt"     = { icon = "tshirt",       whimsy = ["Hawaiian shirt", "Mesh jersey"] }
"Long sleeves"      = { icon = "sweater",      whimsy = ["Rugby shirt", "Striped long tee"] }
"Sweater"           = { icon = "sweater",      whimsy = ["Ugly sweater", "Fisherman knit"] }
"Hoodie"            = { icon = "hoodie",       whimsy = ["Dino hoodie", "Bear-ear hoodie"] }
"Light hoodie"      = { icon = "hoodie",       whimsy = ["Varsity hoodie", "Retro track top"] }
# Jackets and coats
"Light jacket"      = { icon = "jacket",       whimsy = ["Denim jacket", "Bomber jacket"] }
"Windbreaker"       = { icon = "jacket",       whimsy = ["80s windbreaker", "Neon anorak"] }
"Rain jacket"       = { icon = "raincoat",     whimsy = ["Duck raincoat", "Fisherman slicker"] }
"Waterproof coat"   = { icon = "raincoat",   whimsy = ["Captain's slicker", "Sailor slicker"] }
"Waterproof parka"  = { icon = "puffy_coat", whimsy = ["Storm parka", "Expedition parka"] }
"Warm coat"         = { icon = "puffy_coat",   whimsy = ["Teddy bear coat", "Sherpa coat"] }
"Winter coat"       = { icon = "puffy_coat",   whimsy = ["Explorer parka", "Duvet coat"] }
# Bottoms
"Shorts"            = { icon = "shorts",       whimsy = ["Board shorts", "Flamingo shorts"] }
"Light pants"       = { icon = "long_pants",   whimsy = ["Bellbottoms", "Parachute pants"] }
"Long pants"        = { icon = "long_pants",   whimsy = ["Corduroys", "Overalls"] }
"Snow pants"        = { icon = "snow_pants",   whimsy = ["Puffy overalls", "Ski bibs"] }
# Shoes
"Sandals"           = { icon = "sandals",      whimsy = ["Jelly sandals", "Gladiator sandals"] }
"Water sandals"     = { icon = "sandals",      whimsy = ["Pool slides", "Reef walkers"] }
"Sneakers"          = { icon = "sneaker",      whimsy = ["Glow sneakers", "High-tops"] }
"Rain boots"        = { icon = "rain_boot",    whimsy = ["Frog rain boots", "Wellies"] }
"Waterproof boots"  = { icon = "rain_boot", whimsy = ["Duck boots", "Galoshes"] }
"Snow boots"        = { icon = "snow_boot",    whimsy = ["Moon boots", "Yeti boots"] }
"Warm boots"        = { icon = "snow_boot",    whimsy = ["Fuzzy boots", "Mukluks"] }
# Hats
"Cap"               = { icon = "cap",          whimsy = ["Captain's hat", "Retro racing cap"] }
"Cap with strap"    = { icon = "cap",         whimsy = ["Safari hat", "Lifeguard hat"] }
"Sun hat"           = { icon = "sun_hat",      whimsy = ["Retro trucker hat", "Straw cowboy hat"] }
"Warm hat"          = { icon = "beanie",       whimsy = ["Pom-pom beanie", "Gnome hat"] }
"Hat over ears"     = { icon = "beanie",       whimsy = ["Trapper hat", "Aviator hat"] }
# Hands, neck, face
"Gloves"            = { icon = "gloves",       whimsy = ["Monster gloves", "Skeleton gloves"] }
"Ski gloves"        = { icon = "gloves",   whimsy = ["Snowball gloves", "Astronaut gloves"] }
"Mittens"           = { icon = "mittens",      whimsy = ["Fox mittens", "Lobster mitts"] }
"Snow mittens"      = { icon = "mittens",      whimsy = ["Penguin mittens", "Yeti mittens"] }
"Scarf"             = { icon = "scarf",        whimsy = ["Extra-long scarf", "Rainbow scarf"] }
"Scarf over face"   = { icon = "scarf",      whimsy = ["Bandit scarf", "Ninja scarf"] }
# Gear
"Sunglasses"        = { icon = "sunglasses",   whimsy = ["Heart sunglasses", "Aviators"] }
"Snow goggles"      = { icon = "sunglasses",   whimsy = ["Mirror goggles", "Glacier glasses"] }
"Sunscreen"         = { icon = "sunscreen",    whimsy = ["Lifeguard zinc", "Zinc war paint"] }
"Water bottle"      = { icon = "water_bottle", whimsy = ["Explorer canteen", "Giant water jug"] }
"Umbrella"          = { icon = "umbrella",     whimsy = ["Duck umbrella", "Bubble umbrella"] }
"Backpack"          = { icon = "backpack",     whimsy = ["Rocket backpack", "Turtle backpack"] }

# The picture each place and thing shows in the hero when it names the day.
# A starred wear item shows its own tile's icon; a name with no entry here
# shows the outcome's own `icon`.
[day_icon]
"Beach"          = "beach"
"Pool"           = "pool"
"Splash Pad"     = "splash_pad"
"Sledding Hill"  = "sledding_hill"
"Ice Rink"       = "ice_rink"
"Paper Boat"     = "paper_boat"
"Kite"           = "kite"
"Sailboat"       = "sailboat"
"Sprinkler"      = "sprinkler"
"Water Balloon"  = "water_balloon"
"Pinwheel"       = "pinwheel"
"Frisbee"        = "frisbee"
"Picnic Blanket" = "picnic_blanket"
"Sidewalk Chalk" = "sidewalk_chalk"
"Sled"           = "sled"
"Ice Skates"     = "ice_skate"

# About one day in `one_in`, one tile swaps to a whimsical alternative. Which
# day, which tile and which alternative are all fixed by the date, so it
# holds all day and a second look at lunch says the same thing. Delete the
# table to turn whimsy off.
[whimsy]
one_in = 3


# ─── Outcomes ────────────────────────────────────────────────────────────
# Two questions, in this order:
#
#   1. How warm does it get?  tempMax picks the band.
#        HOT 78°+   WARM 65-77°   COOL 50-64°   COLD 32-49°   FREEZING under 32°
#
#   2. What else is going on? Inside a band, the first of these that is true
#      decides the extras:
#        snowy      snow >= 1      any daylight hour forecast as snow
#        rainy      rain >= 50     some hour is 50% or likelier
#        windy      wind >= 20     the WIND tile's "Gusty"
#        swingy     swing >= 20    cold now, warm later: 20° between morning and afternoon
#        very sunny cloud <= 15    near-cloudless all day
#        clear      none of the above - the band's plain day
#
# So it is one outcome per square of that grid: 5 bands x 6 conditions,
# less the three squares too warm to snow, which leaves 27. They are
# written band by band, top to bottom; within a band, in the order above,
# because the first `when` that passes wins.
#
# The day's outcome is pinned at the first look from an hour before sunrise
# and held all day, so a forecast high wobbling a degree across a line does
# not repaint the day under whoever is reading it. Numbers on the tiles keep
# updating; the outcome and its name do not. Only an outcome marked
# `breaks_pin = true` - the rain and snow squares - can replace a pinned day,
# because "take the raincoat after all" is worth interrupting for. The
# evening preview of tomorrow is never pinned; tomorrow pins in the morning.
#
# Every condition in a `when` must pass. The very last outcome has no `when`
# at all - it is the catch-all - and since every band above it ends in its
# own "clear" outcome, the only days left by then are freezing and clear.
#
# Colour (the E1002's hero panel) is a three-word vocabulary, so each ink
# keeps one meaning: yellow is the beach day, blue is wet - rain or snow, take
# the gear - and red is genuinely cold. Everything else stays black and white.
#
# The day's name is one of three kinds, and each has its own place to live:
#
#   places = ["Beach"]       somewhere you normally can't go, that today you should
#   things = ["Kite"]        what you need for something only this weather allows
#   "*Umbrella" in `wear`    the most important thing you'll wear for the weather
#
# Write the bare noun; " Day" is added. A starred wear item names the day
# after whatever its tile says today, so on a whimsy day the duck umbrella
# makes it Duck Umbrella Day - and the hero shows that tile's icon. A place
# or thing shows its own icon from [day_icon] below; the outcome's own `icon`
# is the fallback for a name with no picture. All of an outcome's places, things and starred
# items form its pool, and one is picked per day: the same one all day, a
# different one tomorrow. Anything written as {field} in `also` is
# filled in from the forecast - {tempMin}, {tempMax}, {wind} and so on.

# ── HOT · 78° and up ──

[[outcome]]
id      = "hot_rain"
when    = ["tempMax >= 78", "rain >= 50"]
things  = ["Paper Boat"]
tagline = "WARM AND WET"
icon    = "umbrella"
color   = "blue"
breaks_pin = true
wear    = ["T-shirt", "Shorts", "Water sandals", "*Umbrella"]
also    = "Also grab: a towel. Warm rain is still rain."

[[outcome]]
id      = "hot_windy"
when    = ["tempMax >= 78", "wind >= 20"]
things  = ["Kite", "Sailboat"]
tagline = "HOLD ON TO YOUR HAT"
icon    = "wind"
wear    = ["T-shirt", "Shorts", "Sneakers", "Cap with strap"]
also    = "Also grab: the hat with the strap. Gusts up to {wind} mph."

[[outcome]]
id      = "hot_swing"
when    = ["tempMax >= 78", "swing >= 20"]
tagline = "CHILLY NOW, HOT LATER"
icon    = "backpack"
wear    = ["T-shirt", "Shorts", "*Light hoodie", "Backpack"]
also    = "Also grab: hoodie on for the walk, in the backpack by lunch. {tempMin}° to {tempMax}°."

[[outcome]]
id      = "hot_sunny"
when    = ["tempMax >= 78", "cloud <= 15"]
places  = ["Beach", "Pool"]
tagline = "SUN ALL DAY"
icon    = "sun_and_waves"
color   = "yellow"
is_beach_day = true
wear    = ["Light T-shirt", "Shorts", "*Sun hat", "Sunscreen"]
also    = "Also grab: more sunscreen after lunch."

[[outcome]]
id      = "hot_clear"
when    = ["tempMax >= 78"]
places  = ["Splash Pad"]
things  = ["Sprinkler", "Water Balloon"]
tagline = "STAY COOL OUT THERE"
icon    = "sun"
wear    = ["T-shirt", "Shorts", "Sandals", "Water bottle"]
also    = "Also grab: a refill. It gets to {tempMax}°."

# ── WARM · 65° to 77° ──

[[outcome]]
id      = "warm_rain"
when    = ["tempMax >= 65", "tempMax < 78", "rain >= 50"]
tagline = "PUDDLES AHEAD"
icon    = "rain_boot"
color   = "blue"
breaks_pin = true
wear    = ["T-shirt", "Light pants", "*Rain jacket", "*Rain boots"]
also    = "Also grab: dry socks for the backpack."

[[outcome]]
id      = "warm_windy"
when    = ["tempMax >= 65", "tempMax < 78", "wind >= 20"]
things  = ["Pinwheel"]
tagline = "ZIP IT UP"
icon    = "wind"
wear    = ["T-shirt", "Light pants", "*Windbreaker", "Sneakers"]
also    = "Also grab: zip the jacket. Gusts up to {wind} mph."

[[outcome]]
id      = "warm_swing"
when    = ["tempMax >= 65", "tempMax < 78", "swing >= 20"]
tagline = "HOODIE NOW, NOT LATER"
icon    = "hoodie"
wear    = ["T-shirt", "Light pants", "*Hoodie", "Sneakers"]
also    = "Also grab: the hoodie comes off by lunch. {tempMin}° to {tempMax}°."

[[outcome]]
id      = "warm_sunny"
when    = ["tempMax >= 65", "tempMax < 78", "cloud <= 15"]
things  = ["Frisbee", "Picnic Blanket"]
tagline = "BRIGHT ALL DAY"
icon    = "sunglasses"
wear    = ["T-shirt", "Shorts", "Sunscreen", "*Sunglasses"]
also    = "Also grab: sunscreen on the back of the neck."
also_near_beach        = "{degreesShort}° short of a beach day. Lovely for the park, chilly in the water."
also_near_beach_within = 5

[[outcome]]
id      = "warm_clear"
when    = ["tempMax >= 65", "tempMax < 78"]
things  = ["Sidewalk Chalk"]
tagline = "SHORTS WEATHER"
icon    = "tshirt"
wear    = ["*T-shirt", "*Shorts", "Sneakers", "Cap"]
also    = "Also grab: light pants instead, if the morning is chilly."
also_near_beach        = "{degreesShort}° short of a beach day. Lovely for the park, chilly in the water."
also_near_beach_within = 5

# ── COOL · 50° to 64° ──

[[outcome]]
id      = "cool_rain"
when    = ["tempMax >= 50", "tempMax < 65", "rain >= 50"]
tagline = "HOOD UP"
icon    = "raincoat"
color   = "blue"
breaks_pin = true
wear    = ["Long sleeves", "Long pants", "*Rain jacket", "*Rain boots"]
also    = "Also grab: the hood goes up today. It's a cool rain."

[[outcome]]
id      = "cool_windy"
when    = ["tempMax >= 50", "tempMax < 65", "wind >= 20"]
things  = ["Kite"]
tagline = "CHILLY GUSTS"
icon    = "wind"
wear    = ["Long sleeves", "Long pants", "*Windbreaker", "Sneakers"]
also    = "Also grab: zip the windbreaker to the top. Gusts up to {wind} mph."

[[outcome]]
id      = "cool_swing"
when    = ["tempMax >= 50", "tempMax < 65", "swing >= 20"]
tagline = "LAYER ON, LAYER OFF"
icon    = "jacket"
wear    = ["T-shirt", "*Hoodie", "*Light jacket", "Long pants"]
also    = "Also grab: hoodie and jacket on top, off one at a time. {tempMin}° to {tempMax}°."

[[outcome]]
id      = "cool_sunny"
when    = ["tempMax >= 50", "tempMax < 65", "cloud <= 15"]
tagline = "COOL BUT BRIGHT"
icon    = "sun"
wear    = ["*Long sleeves", "Long pants", "*Sunglasses", "Sunscreen"]
also    = "Also grab: sunscreen. Cool air still burns."

[[outcome]]
id      = "cool_clear"
when    = ["tempMax >= 50", "tempMax < 65"]
tagline = "GRAB ONE BY THE DOOR"
icon    = "jacket"
wear    = ["Long sleeves", "*Long pants", "*Light jacket", "Sneakers"]
also    = "Also grab: a hoodie works too, if it's the one that gets worn."

# ── COLD · 32° to 49° ──

[[outcome]]
id      = "cold_snow"
when    = ["tempMax >= 32", "tempMax < 50", "snow >= 1"]
places  = ["Sledding Hill"]
things  = ["Sled"]
tagline = "BOOTS ON, GLOVES ON"
icon    = "snowflake"
color   = "blue"
breaks_pin = true
wear    = ["Warm coat", "*Snow boots", "Ski gloves", "Warm hat"]
also    = "Also grab: a spare pair of gloves. The first pair gets soaked."

[[outcome]]
id      = "cold_rain"
when    = ["tempMax >= 32", "tempMax < 50", "rain >= 50"]
tagline = "WATERPROOF EVERYTHING"
icon    = "raincoat"
color   = "blue"
breaks_pin = true
wear    = ["Sweater", "*Waterproof coat", "Waterproof boots", "*Gloves"]
also    = "Also grab: hood up, and a dry sweater for later."

[[outcome]]
id      = "cold_windy"
when    = ["tempMax >= 32", "tempMax < 50", "wind >= 20"]
tagline = "ZIPPED TO THE CHIN"
icon    = "scarf"
color   = "red"
wear    = ["*Warm coat", "Hat over ears", "Gloves", "*Scarf"]
also    = "Also grab: zip the coat all the way. Gusts up to {wind} mph."

[[outcome]]
id      = "cold_swing"
when    = ["tempMax >= 32", "tempMax < 50", "swing >= 20"]
tagline = "COAT NOW, SWEATER LATER"
icon    = "sweater"
color   = "red"
wear    = ["T-shirt", "*Sweater", "*Warm coat", "Long pants"]
also    = "Also grab: the coat comes off when it warms up. {tempMin}° to {tempMax}°."

[[outcome]]
id      = "cold_sunny"
when    = ["tempMax >= 32", "tempMax < 50", "cloud <= 15"]
tagline = "COLD BUT SHINY"
icon    = "sunglasses"
color   = "red"
wear    = ["*Warm coat", "Warm hat", "*Gloves", "Sunglasses"]
also    = "Also grab: sunglasses. Low winter sun is bright."

[[outcome]]
id      = "cold_clear"
when    = ["tempMax >= 32", "tempMax < 50"]
tagline = "BUNDLE UP"
icon    = "puffy_coat"
color   = "red"
wear    = ["Sweater", "Long pants", "*Warm coat", "*Warm hat"]
also    = "Also grab: mittens in the coat pocket, just in case."

# ── FREEZING · under 32° ──

[[outcome]]
id      = "freezing_snow"
when    = ["tempMax < 32", "snow >= 1"]
places  = ["Sledding Hill"]
things  = ["Sled"]
tagline = "FULL SNOW GEAR"
icon    = "snowflake"
color   = "blue"
breaks_pin = true
wear    = ["Winter coat", "*Snow pants", "Snow boots", "Snow mittens"]
also    = "Also grab: a warm hat. Snow gear stops at the neck."

[[outcome]]
id      = "freezing_rain"
when    = ["tempMax < 32", "rain >= 50"]
tagline = "SLIPPERY OUT THERE"
icon    = "raincoat"
color   = "blue"
breaks_pin = true
wear    = ["*Waterproof parka", "Waterproof boots", "*Snow mittens", "Warm hat"]
also    = "Also grab: slow steps. Freezing rain turns to ice."

[[outcome]]
id      = "freezing_windy"
when    = ["tempMax < 32", "wind >= 20"]
tagline = "COVER YOUR FACE"
icon    = "scarf"
color   = "red"
wear    = ["*Winter coat", "Scarf over face", "Hat over ears", "*Mittens"]
also    = "Also grab: cover every bit of skin. Gusts up to {wind} mph."

[[outcome]]
id      = "freezing_swing"
when    = ["tempMax < 32", "swing >= 20"]
tagline = "LAYERS UNDER THE COAT"
icon    = "puffy_coat"
color   = "red"
wear    = ["Long sleeves", "*Sweater", "*Winter coat", "Warm hat"]
also    = "Also grab: layers under the coat, to peel off later. {tempMin}° to {tempMax}°."

[[outcome]]
id      = "freezing_sunny"
when    = ["tempMax < 32", "cloud <= 15"]
places  = ["Ice Rink"]
things  = ["Ice Skates"]
tagline = "BRIGHT AND BITTER"
icon    = "sunglasses"
color   = "red"
wear    = ["Winter coat", "Warm hat", "Mittens", "Snow goggles"]
also    = "Also grab: shades. Snow throws the sun right back up."

# The catch-all: no `when`, so it is what is left - and by here, that is only
# a freezing day with nothing else going on.
[[outcome]]
id      = "freezing_clear"
places  = ["Ice Rink"]
tagline = "BUNDLE UP TIGHT"
icon    = "beanie"
color   = "red"
wear    = ["*Winter coat", "Warm hat", "*Mittens", "Warm boots"]
also    = "Also grab: an extra pair of socks."


# ─── Conditions grid (3 × 2) ────────────────────────────────────────────
# Six cells in a 3×2 grid, each with: icon + label, a big primary value, and a
# descriptive line below (either `word` alone or `word (sub)` when `sub_*` is
# also set). Bands are read top to bottom; the first whose `max` is at or
# above the value wins.

[[stat]]
id    = "sunshine"
label = "SUN"
icon_field = "cloud"
icon_bands = [
  { max = 35, icon = "sun" },
  { max = 75, icon = "cloud" },
  { max = 100, icon = "rain_cloud" },
]
value_field = "sunHours"
value_bands = [
  { max = 0, text = "None" },
  { max = 2, text = "Brief" },
  { max = 24, text = "{sunWindow}" },
]
sub_field = "cloud"
sub_format = "{value}% cloudy"
word_field = "sunHours"
word_bands = [
  { max = 0, text = "Overcast" },
  { max = 2, text = "Brief" },
  { max = 4, text = "A stretch" },
  { max = 24, text = "Clear" },
]

[[stat]]
id    = "temp"
label = "TEMP"
icon  = "thermometer"
value_field = "tempMax"
value_format = "{tempMin}–{tempMax}°"
word_field = "tempMax"
word_bands = [
  { max = 50, text = "Cold all day" },
  { max = 62, text = "Cool all day" },
  { max = 72, text = "Mild" },
  { max = 82, text = "Warm" },
  { max = 200, text = "Hot" },
]
word_override = { field = "swing", op = ">=", value = 22, text = "Big swing" }

[[stat]]
id    = "rain"
label = "RAIN"
icon  = "rain_cloud"
value_field = "rain"
value_bands = [
  { max = 20, text = "{value}%" },
  { max = 100, text = "{rainWindow}" },
]
sub_field = "rain"
sub_format = "{value}% chance"
word_field = "rain"
word_bands = [
  { max = 10, text = "Dry" },
  { max = 30, text = "Mostly dry" },
  { max = 55, text = "Showers" },
  { max = 100, text = "Wet" },
]

[[stat]]
id    = "humidity"
label = "HUMIDITY"
icon  = "raindrop"
value_field = "humidityMax"
